name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # Android: cross-compiled on Ubuntu with the Android NDK.
          # Parsers must be built with an Android-targeting clang triple.
          # Target: arm64-v8a (aarch64)
          - os: ubuntu-latest
            platform: android-aarch64
            android_target: aarch64-linux-android
            android_api: 29

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android NDK
        if: matrix.platform == 'android-aarch64'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build parsers
        if: matrix.platform != 'android-aarch64'
        run: python build.py -o dist

      # `tree-sitter build` honors the CC env var (incl. extra flags like
      # --target), so pointing CC at the NDK clang cross-compiles the parsers.
      # See https://developer.android.com/ndk/guides/other_build_systems
      - name: Build parsers (Android)
        if: matrix.platform == 'android-aarch64'
        run: python build.py -o dist
        env:
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.android_target }}${{ matrix.android_api }}-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.android_target }}${{ matrix.android_api }}-clang++
          AR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

      - name: Verify Android libraries
        if: matrix.platform == 'android-aarch64'
        run: |
          file dist/*.so
          file dist/*.so | grep -q "ARM aarch64" || (echo "Expected ARM aarch64 libraries" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-parsers-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -lh release/

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: "${{ steps.date.outputs.date }} (build #${{ github.run_number }})"
          make_latest: true
          generate_release_notes: true
          files: release/*.zip
